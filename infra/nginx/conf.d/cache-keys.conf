# Shared cache zones and cache keys (http level), used by the edge and the portal.
proxy_cache_path /var/lib/nginx/edge-cache levels=1:2 keys_zone=edge_cache:64m max_size=4g inactive=60m;
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

# portal PHP-FPM page cache
fastcgi_cache_path /var/lib/nginx/portal-cache levels=1:2 keys_zone=portal_pages:32m max_size=1g inactive=30m;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_cache_valid 200 10m;
