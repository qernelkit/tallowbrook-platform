# portal.tallowbrook.example: the 2016 customer portal (PHP-FPM on portal-app-01).
# The depot kiosk browsers still connect with these settings; they go when billing-dotnet takes over the portal.

server {
    listen 80;
    server_name portal.tallowbrook.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.tallowbrook.example;

    ssl_certificate     /etc/tallowbrook/pki/services/portal-2016.crt;
    ssl_certificate_key /etc/tallowbrook/pki/services/portal-2016.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-SHA:AES128-SHA:DES-CBC3-SHA:RC4-SHA;
    add_header Public-Key-Pins 'pin-sha256="/Sofjqbaef2kYxxiLkIIRt8YhpHm6zMHBt8gKjckoos="; pin-sha256="o6gs7pHAmTyDezaFnb9DbzpH1QJf1JS7stW1BVEB5gs="; max-age=5184000; includeSubDomains' always;

    root /srv/portal/public;
    index index.php;

    access_log /var/log/nginx/portal.access.log combined;
    error_log /var/log/nginx/portal.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php7.0-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(css|js|png|jpg|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
