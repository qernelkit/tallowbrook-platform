# api.tallowbrook.example and www.tallowbrook.example: public API edge on edge-ord1.
# edge.tallowbrook.example serves the same gateways with the M3 certificate.
# mta-sts.tallowbrook.example serves the MTA-STS policy for mx1.

upstream api_gateway {
    zone api_gateway 64k;
    server api-gw-01.tallowbrook.example:8080 max_fails=3 fail_timeout=10s;
    server api-gw-02.tallowbrook.example:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream partner_intake {
    zone partner_intake 64k;
    server partner-intake-01.tallowbrook.example:8090 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tallowbrook.example www.tallowbrook.example edge.tallowbrook.example mta-sts.tallowbrook.example;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tallowbrook.example www.tallowbrook.example;

    ssl_certificate         /etc/tallowbrook/pki/services/fullchain-api.pem;
    ssl_certificate_key     /etc/tallowbrook/pki/services/api.key;
    ssl_trusted_certificate /etc/tallowbrook/pki/ca/chain-ec.pem;
    ssl_stapling            on;
    ssl_stapling_verify     on;

    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    proxy_cache_key $scheme$host$request_uri;

    # partner systems present a client certificate; only /partner/ insists on one
    ssl_client_certificate /etc/tallowbrook/pki/ca/issuing-ec.crt;
    ssl_verify_client optional;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/api.access.log combined;

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /partner/ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        proxy_pass http://partner_intake;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Partner-Subject $ssl_client_s_dn;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edge.tallowbrook.example;

    ssl_certificate     /etc/tallowbrook/pki/services/edge-mldsa.crt;
    ssl_certificate_key /etc/tallowbrook/pki/services/edge-mldsa.key;
    ssl_conf_command SignatureAlgorithms mldsa65:ed25519:ecdsa_secp256r1_sha256:rsa_pss_rsae_sha256;

    access_log /var/log/nginx/edge.access.log combined;

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mta-sts.tallowbrook.example;

    ssl_certificate     /etc/tallowbrook/pki/services/fullchain-api.pem;
    ssl_certificate_key /etc/tallowbrook/pki/services/api.key;

    root /etc/nginx/html/mta-sts;

    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        add_header Cache-Control "max-age=86400";
    }

    location / {
        return 404;
    }
}
