# internal.tallowbrook.example: back-office callers reach payments-java through the edge.
# The edge authenticates to payments with the mesh client certificate.

upstream payments_backend {
    hash $remote_addr consistent;
    server payments-01.tallowbrook.example:8443 max_fails=2 fail_timeout=15s;
    server payments-02.tallowbrook.example:8443 max_fails=2 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 8080;
    server_name internal.tallowbrook.example;

    allow 10.20.0.0/16;
    allow 127.0.0.1;
    deny all;

    access_log /var/log/nginx/internal.access.log combined;

    location /payments/ {
        proxy_pass https://payments_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host payments.tallowbrook.example;
        proxy_set_header X-Request-Id $request_id;

        proxy_ssl_certificate         /etc/tallowbrook/pki/services/mesh-client.crt;
        proxy_ssl_certificate_key     /etc/tallowbrook/pki/services/mesh-client.key;
        proxy_ssl_trusted_certificate /etc/tallowbrook/pki/ca/issuing-rsa.crt;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_server_name         on;
        proxy_ssl_protocols           TLSv1.3;

        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
