# edge-ord1: nginx 1.26 main config. Sites live in conf.d/, one file per hostname group.
user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    server_tokens off;

    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # access log carries the negotiated protocol so the edge dashboards can split traffic by client
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    log_format edge_tls '$remote_addr [$time_local] "$request" $status $ssl_protocol/$ssl_cipher $request_time';
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:edge_tls:50m;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/access.log edge_tls;

    proxy_buffers 16 32k;
    proxy_buffer_size 32k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    resolver 10.20.0.53 valid=300s;
    resolver_timeout 5s;

    include conf.d/*.conf;
}
