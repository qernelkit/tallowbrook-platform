# Sealed Secrets controller, from the upstream release manifest. Being replaced
# by SOPS + age (overlays/*/*.enc.yaml); new secrets go there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.32.2/controller.yaml
images:
  - name: docker.io/bitnami/sealed-secrets-controller
    newName: registry.tallowbrook.example/mirror/sealed-secrets-controller
    newTag: 0.32.2
