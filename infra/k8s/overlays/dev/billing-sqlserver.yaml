# SQL Server for local billing work (migrations under infra/db/migrations/sqlserver).
# Same major version and CU as the billing instance.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-sqlserver
  namespace: billing
spec:
  serviceName: billing-sqlserver
  replicas: 1
  selector:
    matchLabels:
      app: billing-sqlserver
  template:
    metadata:
      labels:
        app: billing-sqlserver
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
          ports:
            - name: tds
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-sqlserver-sa
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-sqlserver
  namespace: billing
spec:
  clusterIP: None
  selector:
    app: billing-sqlserver
  ports:
    - name: tds
      port: 1433
      targetPort: tds
