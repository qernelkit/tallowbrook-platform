apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: control-plane
  namespace: istio-system
spec:
  profile: default
  revision: 1-27
  meshConfig:
    accessLogFile: /dev/stdout
    enableTracing: true
    tlsDefaults:
      minProtocolVersion: TLSV1_3
    defaultConfig:
      holdApplicationUntilProxyStarts: true
  components:
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          hpaSpec:
            minReplicas: 3
            maxReplicas: 10
    egressGateways:
      - name: istio-egressgateway
        enabled: false
