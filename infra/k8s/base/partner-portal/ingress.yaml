apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: partner-portal
  namespace: partner-portal
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - portal.partners.tallowbrook.example
      secretName: partner-portal-tls
  rules:
    - host: portal.partners.tallowbrook.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partner-portal
                port:
                  number: 8080
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: partner-uploads
                port:
                  number: 8080
