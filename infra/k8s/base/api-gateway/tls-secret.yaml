# Serving certificate for api.tallowbrook.example at the Istio ingress, issued by
# the PKI team (Tallowbrook Issuing CA E2-1). Replace both values together.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-tls
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: api-gateway
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
