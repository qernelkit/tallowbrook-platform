# hostapd 2.10 on the depot access points (depot-ams1 build).
# BSS 1: TB-Depot-Scan for the handheld scanners. BSS 2: TB-Depot-Ops for staff laptops (802.1X, built-in EAP server).
interface=wlan0
driver=nl80211
ctrl_interface=/run/hostapd
ctrl_interface_group=0
logger_syslog=-1
logger_syslog_level=2
country_code=NL
ieee80211d=1
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
wmm_enabled=1

ssid=TB-Depot-Scan
wpa=2
wpa_key_mgmt=SAE
sae_password=ZlCvYken7QLDrpXK1WJvEoCNsklE
sae_groups=19 20
rsn_pairwise=CCMP
group_mgmt_cipher=AES-128-CMAC
ieee80211w=2
ap_isolate=1

bss=wlan0_1
ssid=TB-Depot-Ops
wpa=2
wpa_key_mgmt=WPA-EAP-SHA256
rsn_pairwise=CCMP
ieee8021x=1
eap_server=1
ca_cert=/etc/tallowbrook/pki/ca/issuing-ec.crt
server_cert=/etc/tallowbrook/pki/services/radius-eap.crt
private_key=/etc/tallowbrook/pki/services/radius-eap.key
tls_flags=[DISABLE-TLSv1.0][DISABLE-TLSv1.1][ENABLE-TLSv1.3]
