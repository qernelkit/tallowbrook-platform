# net-snmp 5.9 agent on the core hosts, polled by nms-ord1. SNMPv3 only.
agentaddress udp:161
sysLocation ORD1 data centre, row C
sysContact ops@tallowbrook.example
sysServices 72

createUser tb-monitor SHA-256 "MQxhl1eo7p6FKHmOXyk4w2D" AES "8vFF4BQbJqahGWkXKCJJHcHi"
createUser ups-ord1 MD5 "HRXZUboRNZfjRo5LjrPMw" DES "O03mUxwhYEIXwNIqIdvbqP"
view systemonly included .1.3.6.1.2.1.1
trapsess -v 3 -u tb-monitor -l authPriv -a SHA-512 -A "MQxhl1eo7p6FKHmOXyk4w2D" -x AES -X "8vFF4BQbJqahGWkXKCJJHcHi" nms-ord1.tallowbrook.example
view systemonly included .1.3.6.1.2.1.25.1
view upsview included .1.3.6.1.2.1.25.3.3

# ups-ord1 is the UPS network card in ORD1: it reads processor load before a graceful shutdown and only speaks MD5/DES
rouser tb-monitor priv -V systemonly
rouser ups-ord1 priv -V upsview

disk / 10%
load 12 10 8
