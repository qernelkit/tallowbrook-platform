# tac_plus-ng (tacacs-ord1): admin logins on the switches and routers.
# Users and groups come from Active Directory through the MAVIS LDAP backend.
id = spawnd {
    listen = { port = 49 }
    spawn = { instances min = 1 instances max = 8 }
    background = yes
}

id = tac_plus-ng {
    log authlog { destination = /var/log/tac_plus-ng/auth.log }
    log acctlog { destination = /var/log/tac_plus-ng/acct.log }
    authentication log = authlog
    authorization log = authlog
    accounting log = acctlog

    mavis module = external {
        setenv LDAP_SERVER_TYPE = "microsoft"
        setenv LDAP_HOSTS = "ldaps://dc-ord1.tallowbrook.example ldaps://dc-ord2.tallowbrook.example"
        setenv LDAP_BASE = "dc=tallowbrook,dc=example"
        setenv LDAP_USER = "svc-netauth@tallowbrook.example"
        setenv LDAP_PASSFILE = "/etc/tac_plus-ng/ldap.pass"
        exec = /usr/local/lib/mavis/mavis_tacplus-ng_ldap.pl
    }
    login backend = mavis
    user backend = mavis

    device core-network {
        address = 10.20.0.0/24
        key = "PFaJqlr33U1eA0KA2y7FOLzFFKQreOxJ"
        welcome banner = "Tallowbrook network: authorised staff only\n"
    }

    profile netadmin {
        script {
            if (service == shell) {
                if (cmd == "") { set priv-lvl = 15 permit }
                permit
            }
        }
    }

    profile netview {
        script {
            if (service == shell) {
                if (cmd == "") { set priv-lvl = 1 permit }
                if (cmd =~ /^show /) permit
                deny
            }
        }
    }

    ruleset {
        rule netops {
            script {
                if (memberof =~ /^CN=net-admins,/) { profile = netadmin permit }
                if (memberof =~ /^CN=net-noc,/) { profile = netview permit }
            }
        }
    }
}
