# MIT krb5 client config, realm TALLOWBROOK.EXAMPLE (bastions, file servers, the depot-scans NAS)
[libdefaults]
    default_realm = TALLOWBROOK.EXAMPLE
    dns_lookup_realm = false
    dns_lookup_kdc = true
    ticket_lifetime = 10h
    renew_lifetime = 7d
    forwardable = true
    rdns = false
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 rc4-hmac
    default_tgs_enctypes = aes256-cts-hmac-sha384-192 aes256-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128 aes256-cts-hmac-sha1-96 rc4-hmac
    # the Amsterdam depot NAS (nas-ams1) firmware only takes rc4-hmac tickets; remove with the NAS swap
    allow_rc4 = true

[realms]
    TALLOWBROOK.EXAMPLE = {
        kdc = kdc-ord1.tallowbrook.example
        kdc = kdc-ord2.tallowbrook.example
        admin_server = kdc-ord1.tallowbrook.example
        default_domain = tallowbrook.example
    }

[domain_realm]
    .tallowbrook.example = TALLOWBROOK.EXAMPLE
    tallowbrook.example = TALLOWBROOK.EXAMPLE
