# Samba 4 member server nas-ord1: depot scan drop and the EDI inbound share.
[global]
    workgroup = TALLOWBROOK
    realm = TALLOWBROOK.EXAMPLE
    security = ads
    server role = member server
    server string = depot document store
    netbios name = NAS-ORD1
    log file = /var/log/samba/log.%m
    max log size = 10000
    logging = file

    server min protocol = SMB3_11
    server smb encrypt = required
    server signing = mandatory
    server smb3 encryption algorithms = AES-256-GCM, AES-128-GCM
    server smb3 signing algorithms = AES-128-GMAC, AES-128-CMAC
    mangling method = hash2
    ntlm auth = ntlmv2-only

    idmap config * : backend = tdb
    idmap config * : range = 3000-7999
    idmap config TALLOWBROOK : backend = rid
    idmap config TALLOWBROOK : range = 10000-999999
    winbind use default domain = yes
    winbind refresh tickets = yes

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[depot-scans]
    path = /srv/samba/depot-scans
    comment = Scanned delivery notes from the depots
    read only = no
    valid users = @depot-scanners
    create mask = 0660
    directory mask = 0770

[edi-inbound]
    path = /srv/samba/edi-inbound
    comment = EDI DESADV despatch advices from carriers
    read only = yes
    valid users = @edi-ops
