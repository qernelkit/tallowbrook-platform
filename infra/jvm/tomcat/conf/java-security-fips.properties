# Provider list for the payments console Tomcat JVM. Passed with
#   -Djava.security.properties==/opt/tomcat/conf/java-security-fips.properties
# in the systemd unit (double '=': this list replaces the JDK's provider list).
security.provider.1=org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider
security.provider.2=org.bouncycastle.jsse.provider.BouncyCastleJsseProvider fips:BCFIPS
security.provider.3=SUN
