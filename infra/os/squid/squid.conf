# Squid 6 on egress-ord1: outbound proxy for the build hosts. HTTPS to the outside is inspected
# with the egress inspection CA, which the build images trust.
http_port 3128 ssl-bump tls-cert=/etc/tallowbrook/pki/egress/inspection-ca.crt tls-key=/etc/tallowbrook/pki/egress/inspection-ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=16MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 16MB
sslcrtd_children 8 startup=1 idle=1
tls_outgoing_options min-version=1.2 options=NO_TICKET cipher=HIGH:!aNULL:!MD5:!RC4

acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

acl build_hosts src 10.20.12.0/22
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow build_hosts
http_access deny all

cache_mem 1024 MB
maximum_object_size 512 MB
cache_dir ufs /var/spool/squid 20000 16 256
coredump_dir /var/spool/squid
access_log daemon:/var/log/squid/access.log squid

refresh_pattern -i \.(deb|rpm|jar|whl|tgz)$ 10080 90% 43200
refresh_pattern ^ftp: 1440 20% 10080
refresh_pattern . 0 20% 4320
