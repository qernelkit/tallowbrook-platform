# ns1-ord1: BIND 9.20 primary for tallowbrook.example and depots.tallowbrook.example.
# ns2 (10.20.0.54) is the secondary. See ../README.md for how the two zones are signed.

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on port 853 tls dot-ord1 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    allow-transfer { 10.20.0.54; };
    also-notify { 10.20.0.54; };
    notify explicit;
    dnssec-validation auto;
    minimal-responses yes;
    version none;
    querylog no;
};

# DNS over TLS for the depot resolvers; certificate renewed by ACME into /etc/bind/tls
tls dot-ord1 {
    key-file "/etc/bind/tls/dot-ord1.key";
    cert-file "/etc/bind/tls/dot-ord1.crt";
    protocols { TLSv1.2; TLSv1.3; };
    ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305";
};

# depots.tallowbrook.example is signed by named itself
dnssec-policy "depots" {
    keys {
        ksk key-directory lifetime unlimited algorithm ecdsap256sha256;
        zsk key-directory lifetime P90D algorithm ecdsap256sha256;
    };
    nsec3param iterations 0 optout no salt-length 0;
    max-zone-ttl 1d;
    zone-propagation-delay 300;
    parent-ds-ttl 3600;
    parent-propagation-delay 1h;
    publish-safety 1h;
    retire-safety 1h;
    signatures-refresh 5d;
    signatures-validity 14d;
};

logging {
    channel default_log {
        file "/var/log/named/named.log" versions 5 size 50m;
        print-time yes;
        severity info;
    };
    category default { default_log; };
    category lame-servers { null; };
};

zone "tallowbrook.example" {
    type primary;
    # signed offline with dnssec-signzone; this is the signed output of zones/tallowbrook.example.zone
    file "/var/lib/bind/tallowbrook.example.zone.signed";
};

zone "depots.tallowbrook.example" {
    type primary;
    file "/var/lib/bind/depots.tallowbrook.example.zone";
    dnssec-policy "depots";
    key-directory "/var/lib/bind";
    inline-signing yes;
};
