# Kafka 3.9 (KRaft): telemetry cluster broker kafka-ord1-1. Controllers run on kafka-ctl-ord1-{1,2,3}.
process.roles=broker
node.id=11
controller.quorum.bootstrap.servers=kafka-ctl-ord1-1.tallowbrook.example:9093,kafka-ctl-ord1-2.tallowbrook.example:9093,kafka-ctl-ord1-3.tallowbrook.example:9093
controller.listener.names=CONTROLLER
listeners=SASL_SSL://0.0.0.0:9092
advertised.listeners=SASL_SSL://kafka-ord1-1.tallowbrook.example:9092
listener.security.protocol.map=SASL_SSL:SASL_SSL,CONTROLLER:SSL
inter.broker.listener.name=SASL_SSL

log.dirs=/var/lib/kafka/data
num.partitions=12
default.replication.factor=3
min.insync.replicas=2
log.retention.hours=168
log.segment.bytes=1073741824
auto.create.topics.enable=false

# TLS values come from files managed by the kafka-tls role
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/tls/broker.p12
ssl.keystore.password=${file:/etc/kafka/tls/credentials.properties:keystore.password}
ssl.truststore.location=/etc/kafka/tls/truststore.p12
ssl.truststore.password=${file:/etc/kafka/tls/credentials.properties:truststore.password}
ssl.enabled.protocols=${file:/etc/kafka/tls/tls-policy.properties:enabled.protocols}
ssl.cipher.suites=${file:/etc/kafka/tls/tls-policy.properties:cipher.suites}
ssl.endpoint.identification.algorithm=https

sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.sasl_ssl.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-broker" password="${file:/etc/kafka/tls/credentials.properties:scram.password}";

group.initial.rebalance.delay.ms=3000
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
