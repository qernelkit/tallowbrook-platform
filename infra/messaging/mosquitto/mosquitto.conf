# Mosquitto 2.0: MQTT for depot telematics (mqtt.tallowbrook.example).
# Trucks and depot gateways authenticate with client certificates from the E2 issuing CA.
per_listener_settings true
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300
# journald collects stderr
log_dest stderr
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
max_inflight_messages 40
max_queued_messages 2000
max_packet_size 262144

# local health checks only
listener 1883 127.0.0.1
allow_anonymous true

listener 8883
protocol mqtt
cafile /etc/tallowbrook/pki/ca/issuing-ec.crt
certfile /etc/tallowbrook/pki/services/broker.crt
keyfile /etc/tallowbrook/pki/services/broker.key
tls_version tlsv1.3
ciphers_tls1.3 TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
require_certificate true
use_identity_as_username true
allow_anonymous false
