# OpenDKIM on mx1: signs outbound mail for tallowbrook.example (selector mail2026, published in the zone).
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes
UMask                   007
Mode                    s
Domain                  tallowbrook.example
Selector                mail2026
KeyFile                 /etc/tallowbrook/pki/dkim/mail2026.private
SignatureAlgorithm      rsa-sha256
Canonicalization        relaxed/simple
OversignHeaders         From
InternalHosts           127.0.0.1, 10.20.0.0/16
Socket                  inet:8891@localhost
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim
