# RabbitMQ 4.0: depot event bus (mq-ord1). Depot gateways connect over TLS with client certificates.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/tallowbrook/pki/ca/chain-ec.pem
ssl_options.certfile = /etc/tallowbrook/pki/services/broker.crt
ssl_options.keyfile = /etc/tallowbrook/pki/services/broker.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
ssl_options.ciphers.1 = TLS_AES_256_GCM_SHA384
ssl_options.ciphers.2 = TLS_AES_128_GCM_SHA256
ssl_options.ciphers.3 = ECDHE-RSA-AES256-GCM-SHA384
ssl_options.ciphers.4 = ECDHE-RSA-CHACHA20-POLY1305
ssl_options.honor_cipher_order = true

default_vhost = depot-events
loopback_users.guest = true

management.tcp.port = 15672
management.tcp.ip = 127.0.0.1

vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 5GB
heartbeat = 30
log.file.level = info

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@mq-ord1-1
cluster_formation.classic_config.nodes.2 = rabbit@mq-ord1-2
cluster_formation.classic_config.nodes.3 = rabbit@mq-ord1-3
