# PostgreSQL 17: ledger and reports cluster (db-ord1). Overrides only; everything else is the package default.
listen_addresses = '*'
port = 5432
max_connections = 300
superuser_reserved_connections = 5

ssl = on
ssl_cert_file = '/etc/tallowbrook/pki/services/data.crt'
ssl_key_file = '/etc/tallowbrook/pki/services/data.key'
ssl_ca_file = '/etc/tallowbrook/pki/ca/issuing-ec.crt'
ssl_min_protocol_version = 'TLSv1.2'
ssl_ciphers = 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256'
ssl_ecdh_curve = 'secp384r1'

password_encryption = scram-sha-256

work_mem = 32MB
hash_mem_multiplier = 2.0
maintenance_work_mem = 512MB
shared_buffers = 2GB
effective_cache_size = 12GB
effective_io_concurrency = 200
random_page_cost = 1.1

wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 4GB
hot_standby = on
checkpoint_timeout = 15min
max_wal_size = 8GB

log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 0

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
timezone = 'UTC'
