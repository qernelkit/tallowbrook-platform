# Redis 8: web session cache (cache.tallowbrook.example). TLS only, no plaintext port.
bind 10.20.6.30 127.0.0.1
protected-mode yes
port 0
tls-port 6380
tls-cert-file /etc/tallowbrook/pki/services/data.crt
tls-key-file /etc/tallowbrook/pki/services/data.key
tls-ca-cert-file /etc/tallowbrook/pki/ca/issuing-ec.crt
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# sessions are small hashes; keep them in listpack encoding
hash-max-listpack-entries 512
hash-max-listpack-value 128

timeout 300
tcp-keepalive 60
databases 4
maxmemory 6gb
maxmemory-policy volatile-lru
lazyfree-lazy-eviction yes

# sessions are disposable: no RDB, no AOF
save ""
appendonly no

loglevel notice
logfile /var/log/redis/redis-server.log
