# Tenant-sharded backends: keep each tenant on the same app node so its warm caches get reused.
# Internal only; app hosts call these on lb-ord1:8081.
frontend fe_tenant_internal
    bind 10.20.1.12:8081
    mode http
    http-request set-var(txn.shard) req.hdr(x-tenant-id),xxh64,mod(16)
    http-response set-header X-Shard-Hint %[var(txn.shard),base64]
    use_backend be_label_render if { path_beg /labels/ }
    use_backend be_tracking_lookup if { path_beg /track/ }
    default_backend be_tenant_api

backend be_tenant_api
    mode http
    balance hdr(x-tenant-id)
    hash-type consistent sdbm avalanche
    server app-01 app-01.tallowbrook.example:8080 check
    server app-02 app-02.tallowbrook.example:8080 check
    server app-03 app-03.tallowbrook.example:8080 check

backend be_label_render
    mode http
    balance uri
    hash-type map-based djb2
    server label-01 label-01.tallowbrook.example:8085 check
    server label-02 label-02.tallowbrook.example:8085 check

backend be_tracking_lookup
    mode http
    balance url_param tracking_no
    hash-type consistent crc32
    server track-01 track-01.tallowbrook.example:8086 check
    server track-02 track-02.tallowbrook.example:8086 check
