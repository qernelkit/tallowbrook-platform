# lb-ord1: HAProxy 3.0, L7 balancer in front of the API gateways and the partner intake.
# Started with -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d
global
    setenv EDGE_TLS13_SUITES TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    setenv EDGE_TLS12_CIPHERS ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 20000
    ssl-default-bind-ciphersuites "${EDGE_TLS13_SUITES}"
    ssl-default-bind-ciphers "${EDGE_TLS12_CIPHERS}"
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2
    ssl-default-bind-curves X25519MLKEM768:X25519:P-256

defaults
    log-format "%ci:%cp [%tr] %ft %b/%s %ST %B %sslv %sslc"
    log global
    mode http
    option dontlognull
    option forwardfor
    option http-server-close
    retries 2
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 5s

frontend fe_http
    bind :80
    http-request redirect scheme https code 301

frontend fe_api
    bind :443 ssl crt /etc/tallowbrook/pki/services/haproxy-edge.pem alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=63072000"
    use_backend be_portal if { hdr(host) -i portal.tallowbrook.example }
    default_backend be_api_gateways

# partner EDI systems, client certificate required
frontend fe_partner_mtls
    bind :8443 ssl crt /etc/tallowbrook/pki/services/haproxy-edge.pem ca-file /etc/tallowbrook/pki/ca/issuing-ec.crt verify required
    http-request set-header X-Partner-Subject %[ssl_c_s_dn(cn)]
    default_backend be_partner_intake

backend be_api_gateways
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server api-gw-01 api-gw-01.tallowbrook.example:8080 check
    server api-gw-02 api-gw-02.tallowbrook.example:8080 check

backend be_partner_intake
    option httpchk GET /healthz
    server partner-intake-01 partner-intake-01.tallowbrook.example:8090 check

backend be_portal
    server sslgw-ams1 10.40.3.11:8080 check
