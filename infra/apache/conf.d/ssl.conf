# payments console host (Apache 2.4): server-wide mod_ssl settings.
# Vhosts only set certificates; protocol and cipher policy lives here.
<IfModule mod_ssl.c>
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    CustomLog ${APACHE_LOG_DIR}/ssl_request.log "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
    SSLOpenSSLConfCmd Groups SecP384r1MLKEM1024:secp384r1

    SSLHonorCipherOrder off
    SSLSessionCache shmcb:${APACHE_RUN_DIR}/ssl_scache(512000)
    SSLSessionCacheTimeout 300
    SSLStrictSNIVHostCheck on

    # console users sit behind the office proxies; keep idle TLS connections short
    KeepAliveTimeout 5
</IfModule>
