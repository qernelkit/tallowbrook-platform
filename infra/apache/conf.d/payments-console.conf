# payments.tallowbrook.example: payments back-office console.
# Reverse proxy to payments-java, single sign-on through the Tallowbrook IdP (mod_auth_openidc).
<VirtualHost *:443>
    ServerName payments.tallowbrook.example
    ServerAdmin ops@tallowbrook.example

    SSLEngine on
    SSLCertificateFile    /etc/tallowbrook/pki/services/payments.crt
    SSLCertificateKeyFile /etc/tallowbrook/pki/services/payments.key

    # console to payments-java: TLS 1.3 only, server certificate from the R1 issuing CA
    SSLProxyEngine on
    SSLProxyProtocol -all +TLSv1.3
    SSLProxyCACertificateFile /etc/tallowbrook/pki/ca/issuing-rsa.crt
    SSLProxyVerify require
    SSLProxyCheckPeerName on
    SSLProxyCheckPeerExpire on

    OIDCProviderMetadataURL https://login.tallowbrook.example/.well-known/openid-configuration
    OIDCClientID payments-console
    OIDCRedirectURI https://payments.tallowbrook.example/oidc/callback
    # single console node: a fresh session passphrase on every start, users sign in again after a restart
    OIDCCryptoPassphrase "exec:/bin/bash -c \"head /dev/urandom | tr -dc A-Za-z0-9 | head -c 32\""
    OIDCPrivateKeyFiles sig:ops-console-2026-es256#/etc/tallowbrook/pki/keys/token-signing-es256.pem
    OIDCProviderTokenEndpointAuth private_key_jwt
    OIDCIDTokenSignedResponseAlg PS256
    OIDCScope "openid email groups"
    OIDCRemoteUserClaim email
    OIDCSessionInactivityTimeout 1800
    OIDCSessionMaxDuration 28800

    <Location />
        AuthType openid-connect
        Require claim groups:payments-ops
        Require claim groups:finance-ops
    </Location>

    <Location /healthz>
        Require all granted
    </Location>

    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass        /healthz !
    ProxyPass        / https://payments.tallowbrook.example:8443/console/
    ProxyPassReverse / https://payments.tallowbrook.example:8443/console/

    Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Frame-Options DENY

    ErrorLog ${APACHE_LOG_DIR}/payments-console-error.log
    CustomLog ${APACHE_LOG_DIR}/payments-console-access.log combined
</VirtualHost>
