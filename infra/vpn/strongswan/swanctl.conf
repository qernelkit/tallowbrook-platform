# vpn-gw-ord1: strongSwan 6.0 (swanctl). Site-to-site tunnel to the Amsterdam depot gateway.
connections {
    ord1-ams {
        version = 2
        local_addrs = 203.0.113.10
        remote_addrs = 198.51.100.20
        proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem768
        dpd_delay = 30s
        rekey_time = 4h
        mobike = no

        local {
            auth = pubkey
            certs = /etc/tallowbrook/pki/services/vpn-gw.crt
            id = vpn-gw-ord1.tallowbrook.example
        }
        remote {
            auth = pubkey
            cacerts = /etc/tallowbrook/pki/ca/issuing-rsa.crt
            id = vpn-gw-ams1.tallowbrook.example
        }
        children {
            depot-ams-lan {
                local_ts = 10.20.0.0/16
                remote_ts = 10.60.0.0/16
                esp_proposals = aes256gcm16-ecp384-ke1_mlkem768
                rekey_time = 1h
                start_action = trap
                dpd_action = restart
                close_action = trap
            }
        }
    }
}

secrets {
    private-gw {
        file = /etc/tallowbrook/pki/services/vpn-gw.key
    }
}
