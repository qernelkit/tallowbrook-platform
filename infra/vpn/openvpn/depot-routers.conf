# vpn-gw-ord1: OpenVPN 2.6 instance for the depot routers (udp/1195).
# The routers run OpenVPN 2.3 firmware and cannot negotiate data ciphers, so they get the fallback below.
port 1195
proto udp
dev tun1
topology subnet
server 10.97.0.0 255.255.255.0

ca /etc/tallowbrook/pki/ca/issuing-rsa.crt
cert /etc/tallowbrook/pki/services/vpn-gw.crt
key /etc/tallowbrook/pki/services/vpn-gw.key
dh /etc/tallowbrook/pki/vpn/dh2048.pem
data-ciphers-fallback BF-CBC

keepalive 10 60
user nobody
group nogroup
persist-tun
status /var/log/openvpn/depot-routers-status.log 30
verb 3
mute 20
