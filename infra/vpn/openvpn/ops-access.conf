# vpn-gw-ord1: OpenVPN 2.6 server for ops laptops (udp/1194). Client certificates come from the R1 issuing CA.
port 1194
proto udp
dev tun0
topology subnet
server 10.98.0.0 255.255.255.0
ifconfig-pool-persist /var/lib/openvpn/ops-access-ipp.txt

ca /etc/tallowbrook/pki/ca/issuing-rsa.crt
cert /etc/tallowbrook/pki/services/vpn-gw.crt
key /etc/tallowbrook/pki/services/vpn-gw.key
dh /etc/tallowbrook/pki/vpn/dh2048.pem
tls-crypt /etc/tallowbrook/pki/vpn/tls-crypt.key
tls-version-min 1.2
tls-cipher ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305
data-ciphers AES-256-GCM:CHACHA20-POLY1305
auth SHA256
remote-cert-tls client

push "route 10.20.0.0 255.255.0.0"
push "dhcp-option DNS 10.20.0.53"
push "dhcp-option DOMAIN tallowbrook.example"

keepalive 10 120
max-clients 200
user nobody
group nogroup
persist-tun
status /var/log/openvpn/ops-access-status.log 30
verb 3
mute 20
explicit-exit-notify 1
