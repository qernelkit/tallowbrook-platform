# vpn-gw-partner: strongSwan 5.9 (stroke). EDI tunnel to the freight partner.
# The partner's concentrator dictates the proposals until their 2027 refresh; keep in sync with their change notice.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=yes

conn partner-edi
    keyexchange=ikev1
    authby=secret
    left=203.0.113.40
    leftid=203.0.113.40
    leftsubnet=10.20.40.0/24
    right=198.51.100.7
    rightid=198.51.100.7
    rightsubnet=172.16.90.0/24
    ike=aes128-sha1-modp1024!
    esp=3des-sha1!
    ikelifetime=8h
    lifetime=1h
    dpdaction=restart
    dpddelay=30s
    auto=start
