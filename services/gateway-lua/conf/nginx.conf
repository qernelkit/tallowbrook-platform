worker_processes auto;
error_log /dev/stderr warn;

env GATEWAY_SESSION_SECRET;
env GATEWAY_SESSION_SALT;
env GATEWAY_SESSION_V1_SECRET;
env PARTNER_TOKEN_SECRET;
env UPSTREAM_TOKEN_SECRET;
env CDN_ORIGIN_SECRET;
env TRACE_ID_START;

events {
    worker_connections 4096;
}

http {
    lua_package_path "/opt/gateway/lua/?.lua;;";
    lua_shared_dict gateway_cache 32m;
    lua_code_cache on;

    log_format edge '$remote_addr "$request" $status $body_bytes_sent $request_time cache=$upstream_cache_status';
    access_log /dev/stdout edge;

    resolver 127.0.0.11 ipv6=off valid=30s;

    init_by_lua_block {
        require("gateway.config")
        require("gateway.hash_ring").build({ "api-node-1:3000", "api-node-2:3000", "api-node-3:3000" })
    }

    upstream api_backend {
        server api-node-1:3000;
        server api-node-2:3000;
        server api-node-3:3000;
        keepalive 64;
    }

    proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:64m max_size=2g inactive=10m;

    server {
        listen 8080;
        server_name api.tallowbrook.example;

        set $cache_key "";

        location = /healthz {
            access_log off;
            content_by_lua_block { ngx.say("ok") }
        }

        location /downloads/ {
            access_by_lua_block { require("gateway.signed_urls").check() }
            proxy_pass http://api_backend;
        }

        location /partner/ {
            access_by_lua_block {
                require("gateway.jwt_auth").check_partner()
                require("gateway.attestation").set_header()
            }
            proxy_pass http://api_backend;
        }

        location /catalog/ {
            access_by_lua_block { require("gateway.edge_cache").key() }
            proxy_cache edge;
            proxy_cache_key $cache_key;
            proxy_cache_valid 200 60s;
            proxy_pass http://api_backend;
        }

        location /media/ {
            rewrite_by_lua_block { require("gateway.cdn_token").rewrite_origin_pull() }
            proxy_pass http://api_backend;
        }

        location / {
            access_by_lua_block {
                require("gateway.session_cookie").load()
                require("gateway.attestation").set_header()
            }
            rewrite_by_lua_block { require("gateway.body_digest").set_upstream_header() }
            header_filter_by_lua_block { require("gateway.trace_ids").rewrite_response_header() }
            proxy_pass http://api_backend;
        }
    }
}
