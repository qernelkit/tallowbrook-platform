[package]
name = "tallowbrook-ledger"
version = "0.14.2"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Tallowbrook double-entry ledger: journal batches, approvals, archive and bank feeds"

[lib]
name = "ledger"
path = "src/lib.rs"

[[bin]]
name = "ledgerd"
path = "src/main.rs"

[dependencies]
ring = "=0.17.14"
crc32fast = "1.5.2"
rustls = "=0.23.45"
twox-hash = "2.1.2"
openmls = { version = "=0.9.1", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = "=0.6.0"
frost-ed25519 = "=3.0.0"
ml-kem = { version = "=0.3.2", features = ["getrandom", "pkcs8", "pem"] }
k256 = { version = "=0.14.0", features = ["pem"] }
rustc-hash = "2.1.1"
jsonwebtoken = "=9.3.1"
aes-gcm = "=0.11.1"
chacha20poly1305 = "=0.11.0"
sha3 = "=0.12.0"
blake3 = "=1.8.7"
argon2 = "=0.6.0"
hkdf = "=0.13.0"
rsa = { version = "=0.9.10", features = ["sha2", "getrandom"] }
p256 = "=0.14.0"
ed25519-dalek = "=3.0.0"
x25519-dalek = { version = "=3.0.0", features = ["getrandom"] }
rand = "0.8"
hex = "0.4.3"
base64 = "0.22.1"
logos = "0.16.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
thiserror = "2"
